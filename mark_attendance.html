<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ATTENDX — Mark Attendance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .mark-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 1.25rem;
      margin-top: 2rem;
    }

    /* Camera card */
    .camera-card {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cam-controls {
      display: flex;
      gap: 0.75rem;
    }

    #markVideo {
      width: 100%;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      display: block;
    }

    /* Status line */
    #markStatus {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      min-height: 1.4em;
      padding: 0.6rem 0.9rem;
      background: var(--bg1);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      transition: all 0.3s;
    }

    #markStatus.recognized {
      color: var(--green);
      border-color: rgba(0, 255, 157, 0.3);
      background: var(--green-dim);
    }

    #markStatus.error {
      color: var(--red);
      border-color: rgba(255, 61, 90, 0.2);
    }

    /* Recognized list panel */
    .session-panel {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .session-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .session-count {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    #recognizedList {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      list-style: none;
    }

    .rec-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      animation: fadeUp 0.3s ease both;
    }

    .rec-avatar {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--green-dim);
      border: 1px solid rgba(0, 255, 157, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--green);
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .rec-name {
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text);
    }

    .rec-time {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .empty-panel {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    /* Session summary banner */
    #sessionSummary {
      display: none;
      padding: 1rem 1.25rem;
      border-radius: var(--radius);
      border: 1px solid rgba(0, 255, 157, 0.3);
      background: var(--green-dim);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--green);
      margin-top: 0.75rem;
    }

    @media(max-width:800px) {
      .mark-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <nav class="nx-nav">
    <a class="nx-brand" href="/"><span class="nx-brand-icon">◈</span><span>ATTENDX</span></a>
    <div class="nx-nav-links">
      <a href="/" class="nx-link">Dashboard</a>
      <a href="/add_student" class="nx-link">Add Student</a>
      <a href="/mark_attendance" class="nx-link active">Mark Attendance</a>
      <a href="/students_page" class="nx-link">Students</a>
      <a href="/attendance_record" class="nx-link">Records</a>
    </div>
  </nav>

  <main class="nx-page">
    <a href="/" class="nx-back">← Back to Dashboard</a>
    <h1 class="nx-title nx-fade-in">Live <span class="accent">Recognition</span></h1>
    <p class="nx-subtitle nx-fade-in nx-s1">Facial identification · Session-based attendance logging</p>

    <div class="mark-grid">
      <!-- Camera feed -->
      <div class="nx-card camera-card nx-fade-in nx-s2">
        <p class="nx-card-title">Camera Feed</p>
        <div class="cam-controls">
          <button id="startMarkBtn" class="nx-btn nx-btn-primary">▶ Start Session</button>
          <button id="stopMarkBtn" class="nx-btn nx-btn-danger" disabled>■ Stop & Save</button>
        </div>
        <video id="markVideo" autoplay muted style="background:#07080d;min-height:240px;"></video>
        <div id="markStatus">Waiting for session to start…</div>
        <div id="sessionSummary"></div>
      </div>

      <!-- Recognized panel -->
      <div class="nx-card session-panel nx-fade-in nx-s3">
        <div class="session-header">
          <p class="nx-card-title" style="margin:0">Recognized This Session</p>
          <span class="session-count" id="sessionCount">0 faces</span>
        </div>
        <ul id="recognizedList">
          <li class="empty-panel" id="emptyMsg">No faces recognized yet.<br>Start a session to begin.</li>
        </ul>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/camera_mark.js') }}"></script>
  <script>
    // Enhance the recognized list UI
    const origList = document.getElementById('recognizedList');
    const emptyMsg = document.getElementById('emptyMsg');
    const sessionCount = document.getElementById('sessionCount');
    const markStatus = document.getElementById('markStatus');
    const sessionSummary = document.getElementById('sessionSummary');

    // Override the list-item creation from camera_mark.js
    // We intercept the markStatus changes to apply classes
    const observer = new MutationObserver(() => {
      const txt = markStatus.textContent;
      if (txt.includes('👤') || txt.includes('Recognised')) {
        markStatus.className = 'recognized';
      } else if (txt.includes('error') || txt.includes('Not recognised')) {
        markStatus.className = 'error';
      } else {
        markStatus.className = '';
      }
      // Update summary
      if (txt.includes('✅')) {
        sessionSummary.style.display = 'block';
        sessionSummary.textContent = txt.replace('✅ Session ended — ', '✓ Session complete: ');
        markStatus.style.display = 'none';
      }
      // Count
      const items = origList.querySelectorAll('.rec-item').length;
      sessionCount.textContent = items + (items === 1 ? ' face' : ' faces');
      if (items > 0 && emptyMsg) emptyMsg.style.display = 'none';
    });
    observer.observe(markStatus, { childList: true, characterData: true, subtree: true });

    // Patch prepend to use styled items
    const _origPrepend = origList.prepend.bind(origList);
    origList.prepend = function (el) {
      if (el.tagName === 'LI') {
        const text = el.innerText || '';
        const parts = text.split(' — ');
        const name = parts[0] || '?';
        const time = parts[1] || '';
        const styled = document.createElement('li');
        styled.className = 'rec-item';
        styled.innerHTML = `
      <div class="rec-avatar">${name[0].toUpperCase()}</div>
      <div>
        <div class="rec-name">${name}</div>
        <div class="rec-time">${time}</div>
      </div>
    `;
        _origPrepend(styled);
      } else {
        _origPrepend(el);
      }
    };
  </script>
</body>

</html>
